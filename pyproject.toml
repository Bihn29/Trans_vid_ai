[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
testpaths = ["workers", "tests"]
markers = ["integration: cross-process integration tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S603"]
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["workers", "tools"]
