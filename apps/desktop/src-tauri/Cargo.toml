[package]
name = "vietdub-desktop"
version = "0.1.0"
description = "VietDub Studio desktop host"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "vietdub_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "vietdub-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
futures-util = "=0.3.31"
jsonschema = { version = "=0.33.0", default-features = false }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.220", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.6.0"
thiserror = "=2.0.16"
tokio = { version = "=1.47.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.16", features = ["codec", "rt"] }
url = "=2.5.8"
uuid = { version = "=1.18.0", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "=3.21.0"
